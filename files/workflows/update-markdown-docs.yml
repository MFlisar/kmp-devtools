# -----------------------
# Update Markdown Docs
# - generates documentation and updates README snippets
# - validates links and commits generated changes
# -----------------------

name: Update Markdown Docs
run-name: "[${{ github.event_name }}] Update Markdown Docs"

on:
  push:
    branches: [ main, master ]

env:
  CHECKOUT_FETCH_DEPTH: "0"
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  UPDATE_DOCS_GRADLE_TASK: "updateMarkdownFiles"
  DOTNET_VERSION: "8.0.x"
  LYCHEE_ARGS: >-
    --root-dir "${{ github.workspace }}" --verbose --no-progress
    --exclude '(?i)^https://${{ github.repository_owner }}\.github\.io/${{ github.event.repository.name }}/?$'
    --exclude '(?i)^https://${{ github.repository_owner }}\.github\.io/${{ github.event.repository.name }}/demo/?$'
    './**/*.md' './**/*.html'

permissions:
  contents: write

jobs:
  update-markdown-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}

      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Grant Permission to Execute Gradle
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v6

      - name: Run Gradle update task
        run: ./gradlew "$UPDATE_DOCS_GRADLE_TASK"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run MarkdownSnippets
        run: |
          dotnet tool install --global MarkdownSnippets.Tool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
          mdsnippets --convention InPlaceOverwrite --omit-snippet-links true

      - name: Check links with Lychee
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ env.LYCHEE_ARGS }}

      - name: Remove lychee folder
        run: rm -rf lychee

      - name: Commit & push changes (if any)
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "update-docs: automated update [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
