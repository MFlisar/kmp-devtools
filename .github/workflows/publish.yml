# Manual publishing without .config.yml; the destination is always selected explicitly.
name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version and tag: X.Y.Z (release) or X.Y.Z-suffix (pre-release)"
        required: true
        type: string
      target:
        description: Publish target
        required: true
        type: choice
        default: github
        options:
          - maven-central
          - github

env:
  RELEASE_TAG: ${{ inputs.version }}
  PUBLISH_TARGET: ${{ inputs.target }}
  PUBLISH_TYPE: ${{ contains(inputs.version, '-') && 'test' || 'release' }}
  TARGET_REPOSITORY: MFlisar/maven-repository
  TARGET_BRANCH: main
  TARGET_PATH: artifacts
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  VERSION_REGEX: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
  RELEASE_TAG_REGEX: '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
  FILTER_OUT_DUPLICATE_COMMITS: "true"
  COMMITS_HEADING: "## Changes"
  COMMIT_MESSAGE_EXCLUDE_REGEX: |
    ^Merge branch
    ^[. ]+$
    (?i)\[(?:skip ci|ci skip|no ci|skip actions|actions skip)\]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-publishing:
    name: Check publishing inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate destination and credentials
        shell: bash
        env:
          TARGET_REPOSITORY_TOKEN: ${{ secrets.TARGET_REPOSITORY_TOKEN }}
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          case "$PUBLISH_TARGET" in
            maven-central)
              required_secrets=(GPG_KEY GPG_PASSWORD MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD)
              destination="Maven Central"
              ;;
            github)
              required_secrets=(TARGET_REPOSITORY_TOKEN)
              if [[ ! "$TARGET_REPOSITORY" =~ ^[[:alnum:]_.-]+/[[:alnum:]_.-]+$ ]]; then
                echo "::error::TARGET_REPOSITORY must identify owner/repository."
                exit 1
              fi
              if [[ -z "$TARGET_BRANCH" ]] || ! git check-ref-format --branch "$TARGET_BRANCH" >/dev/null; then
                echo "::error::TARGET_BRANCH must be a valid branch name."
                exit 1
              fi
              if [[ -n "$TARGET_PATH" ]]; then
                if [[ ! "$TARGET_PATH" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] ||
                   [[ "/$TARGET_PATH/" == *"/../"* || "/$TARGET_PATH/" == *"/./"* ]] ||
                   [[ "${TARGET_PATH%%/*}" == ".git" ]]; then
                  echo "::error::TARGET_PATH must be a relative path without empty, '.' or '..' segments or a .git root."
                  exit 1
                fi
              fi
              destination="GitHub Maven repository $TARGET_REPOSITORY@$TARGET_BRANCH:/$TARGET_PATH"
              ;;
            *)
              echo "::error::Unsupported publish target: $PUBLISH_TARGET"
              exit 1
              ;;
          esac

          missing_credentials=false
          for secret in "${required_secrets[@]}"; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::$secret is required for publish target $PUBLISH_TARGET."
              missing_credentials=true
            fi
          done
          if [[ "$missing_credentials" == "true" ]]; then
            exit 1
          fi

          echo "::notice title=Publish plan::$RELEASE_TAG -> $destination ($PUBLISH_TYPE)"
          {
            echo "## Publish plan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$RELEASE_TAG\` |"
            echo "| Mode | $PUBLISH_TYPE |"
            echo "| Target (workflow input) | \`$PUBLISH_TARGET\` |"
            echo "| Destination | $destination |"
            echo "| Commit | \`$GITHUB_SHA\` (\`$GITHUB_REF_NAME\`) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last_release="$(
            gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' |
              python3 -c '
          import os, re, sys
          pattern = re.compile(os.environ["RELEASE_TAG_REGEX"])
          def key(tag):
              m = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+.*)?", tag)
              pre = m.group(4)
              pre_key = tuple((0, int(p), "") if p.isdigit() else (1, 0, p.casefold()) for p in re.findall(r"[0-9]+|[A-Za-z]+", pre or ""))
              return (tuple(int(m.group(i)) for i in (1, 2, 3)), int(pre is None), pre_key)
          tags = [t for t in sys.stdin.read().split() if pattern.fullmatch(t)]
          print(max(tags, key=key) if tags else "")
          '
          )"
          errors=()
          if [[ ! "$RELEASE_TAG" =~ $VERSION_REGEX ]]; then
            errors+=("Version '$RELEASE_TAG' is invalid; expected X.Y.Z or X.Y.Z-suffix.")
          else
            if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
              errors+=("Tag '$RELEASE_TAG' already exists.")
            fi
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              errors+=("Release '$RELEASE_TAG' already exists.")
            fi
            if [[ -n "$last_release" ]]; then
              is_greater="$(python3 - "$RELEASE_TAG" "$last_release" <<'PY'
          import re, sys
          def key(tag):
              m = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+.*)?", tag)
              pre = m.group(4)
              pre_key = tuple((0, int(p), "") if p.isdigit() else (1, 0, p.casefold()) for p in re.findall(r"[0-9]+|[A-Za-z]+", pre or ""))
              return (tuple(int(m.group(i)) for i in (1, 2, 3)), int(pre is None), pre_key)
          print("true" if key(sys.argv[1]) > key(sys.argv[2]) else "false")
          PY
              )"
              if [[ "$is_greater" != "true" ]]; then
                errors+=("Version '$RELEASE_TAG' must be greater than the last release '$last_release'.")
              fi
            fi
          fi
          {
            echo
            echo "### Version check"
            echo
            echo "- Last release: \`${last_release:-<none>}\` -> \`$RELEASE_TAG\`"
            if (( ${#errors[@]} > 0 )); then
              printf -- '- %s\n' "${errors[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if (( ${#errors[@]} > 0 )); then
            for error in "${errors[@]}"; do
              echo "::error::$error"
            done
            exit 1
          fi

  publish-library:
    name: Build and publish artifacts
    needs: check-publishing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and publish selected destination
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          TAG: ${{ env.RELEASE_TAG }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          case "$PUBLISH_TARGET" in
            maven-central) task=publish ;;
            github) task=publishAllPublicationsToGitHubRepository ;;
            *) echo "::error::Unsupported publish target: $PUBLISH_TARGET"; exit 1 ;;
          esac
          CI=true ./gradlew "$task" --no-daemon --no-parallel

      - name: Add published artifacts to summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          from xml.etree import ElementTree

          artifacts = set()
          for pom in Path(".").rglob("build/publications/*/pom-default.xml"):
              root = ElementTree.parse(pom).getroot()
              ns = {"m": root.tag[1:].split("}")[0]} if root.tag.startswith("{") else {}
              find = (lambda tag: root.findtext(f"m:{tag}", namespaces=ns)) if ns else root.findtext
              artifacts.add(f"{find('groupId')}:{find('artifactId')}:{find('version')}")
          if not artifacts:
              raise SystemExit("::error::No generated POM files found.")
          print("### Published artifacts\n")
          for artifact in sorted(artifacts):
              print(f"- `{artifact}`")
          PY

      - name: Collect Maven artifacts
        if: ${{ inputs.target == 'github' }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/maven-artifacts"
          mkdir -p "$artifact_directory"
          while IFS= read -r -d '' repository; do
            rsync -a "$repository/" "$artifact_directory/"
          done < <(find ./library -type d -name maven-repo -print0)
          if ! find "$artifact_directory" -type f -name '*.pom' -print -quit | grep -q .; then
            echo "::error::No Maven POM files were generated."
            exit 1
          fi

      - name: Checkout target repository
        if: ${{ inputs.target == 'github' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.TARGET_REPOSITORY_TOKEN }}
          path: target-repository
          fetch-depth: 0

      - name: Copy artifacts and merge Maven metadata
        if: ${{ inputs.target == 'github' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import re
          import shutil
          from pathlib import Path
          from xml.etree import ElementTree

          artifacts = Path(os.environ["RUNNER_TEMP"]) / "maven-artifacts"
          target = Path("target-repository") / os.environ["TARGET_PATH"]
          existing = [
              str(pom.relative_to(artifacts))
              for pom in artifacts.rglob("*.pom")
              if (target / pom.relative_to(artifacts)).exists()
          ]
          if existing:
              raise SystemExit("::error::Version already exists in target repository: " + ", ".join(existing))

          def version_key(version):
              match = re.fullmatch(r"v?(\d+(?:\.\d+)*)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?", version)
              if match is None:
                  return ((), 0, ((1, version.casefold()),))
              core = tuple(int(part) for part in match.group(1).split("."))
              core += (0,) * max(0, 3 - len(core))
              prerelease = match.group(2)
              pre_key = tuple((0, int(p)) if p.isdigit() else (1, p.casefold()) for p in re.findall(r"[0-9]+|[A-Za-z]+", prerelease or ""))
              return (core, int(prerelease is None), pre_key)

          for source in artifacts.rglob("*"):
              if source.is_file():
                  destination = target / source.relative_to(artifacts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  if not destination.exists():
                      shutil.copy2(source, destination)

          for source in artifacts.rglob("maven-metadata.xml"):
              destination = target / source.relative_to(artifacts)
              source_root = ElementTree.parse(source).getroot()
              if source_root.find("version") is not None:
                  continue
              root = ElementTree.parse(destination).getroot()
              source_versioning = source_root.find("versioning")
              versioning = root.find("versioning")
              if source_versioning is None or versioning is None:
                  raise SystemExit("::error::Missing Maven versioning metadata: " + str(source))
              versions = {
                  node.text
                  for parent in (source_versioning, versioning)
                  for node in parent.findall("versions/version")
                  if node.text
              }
              version_list = versioning.find("versions")
              if version_list is None:
                  version_list = ElementTree.SubElement(versioning, "versions")
              version_list.clear()
              for version in sorted(versions, key=version_key):
                  ElementTree.SubElement(version_list, "version").text = version
              for field in ("latest", "release", "lastUpdated"):
                  if field == "lastUpdated":
                      value = source_versioning.findtext(field)
                  else:
                      candidates = versions | {
                          value for parent in (source_versioning, versioning)
                          if (value := parent.findtext(field))
                      }
                      if field == "release":
                          candidates = {v for v in candidates if not v.upper().endswith("-SNAPSHOT")}
                      value = max(candidates, key=version_key) if candidates else None
                  if value:
                      node = versioning.find(field)
                      if node is None:
                          node = ElementTree.SubElement(versioning, field)
                      node.text = value
              ElementTree.indent(root, space="  ")
              ElementTree.ElementTree(root).write(destination, encoding="UTF-8", xml_declaration=True)
              for suffix, algorithm in {".md5": "md5", ".sha1": "sha1", ".sha256": "sha256", ".sha512": "sha512"}.items():
                  checksum = Path(str(destination) + suffix)
                  if checksum.exists() or Path(str(source) + suffix).exists():
                      checksum.write_text(hashlib.new(algorithm, destination.read_bytes()).hexdigest() + "\n", encoding="ascii")
          PY

      - name: Commit and push artifacts
        if: ${{ inputs.target == 'github' }}
        working-directory: target-repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "${TARGET_PATH:-.}"
          if git diff --cached --quiet; then
            echo "::error::No new artifact files to commit."
            exit 1
          fi
          git commit -m "Publish $RELEASE_TAG"
          git push origin "$TARGET_BRANCH"

  create-release:
    name: Create tag and GitHub release
    needs: [check-publishing, publish-library]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release with sorted commit list
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commits_file="$RUNNER_TEMP/release-commits.txt"
          notes_file="$RUNNER_TEMP/release-notes.md"
          previous_release_tag="$(
            git tag --merged HEAD --sort=-version:refname |
              python3 -c 'import os, re, sys; pattern = re.compile(os.environ["RELEASE_TAG_REGEX"]); print(next((tag for tag in sys.stdin.read().splitlines() if pattern.fullmatch(tag)), ""))'
          )"
          if [[ -n "$previous_release_tag" ]]; then
            git log --format=%s "$previous_release_tag..HEAD" > "$commits_file"
          else
            git log --format=%s HEAD > "$commits_file"
          fi
          python3 - "$commits_file" "$notes_file" <<'PY'
          import os
          import pathlib
          import re
          import sys

          source_path, output_path = sys.argv[1:]
          exclusions = [re.compile(p.strip()) for p in os.environ["COMMIT_MESSAGE_EXCLUDE_REGEX"].splitlines() if p.strip()]
          messages = [
              message.strip()
              for message in pathlib.Path(source_path).read_text().splitlines()
              if message.strip() and not any(p.search(message.strip()) for p in exclusions)
          ]
          messages.sort(key=str.casefold)
          if os.environ["FILTER_OUT_DUPLICATE_COMMITS"].strip().lower() == "true":
              unique = {}
              for message in messages:
                  unique.setdefault(message.casefold(), message)
              messages = list(unique.values())
          notes = ""
          if messages:
              notes = "<!-- release-commits:start -->\n" + os.environ["COMMITS_HEADING"] + "\n"
              notes += "".join(f"* {message}\n" for message in messages)
              notes += "<!-- release-commits:end -->\n"
          pathlib.Path(output_path).write_text(notes)
          PY
          release_args=(--target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file "$notes_file")
          if [[ "$PUBLISH_TYPE" == "test" ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          release_url="$(gh release create "$RELEASE_TAG" "${release_args[@]}")"
          {
            echo "### Release"
            echo
            echo "- [$RELEASE_TAG]($release_url)"
            echo "- Previous release tag: \`${previous_release_tag:-<none>}\`"
          } >> "$GITHUB_STEP_SUMMARY"
