name: Publish Module

on:
  workflow_call:
    inputs:
      artifactId:
        required: true
        type: string

      version:
        required: true
        type: string

      moduleConfig:
        required: true
        type: string

      libraryName:
        required: true
        type: string

      mavenFolder:
        required: true
        type: string

      groupId:
        required: true
        type: string

      mavenRepo:
        required: true
        type: string

    secrets:
      mavenRepoToken:
        required: true

permissions:
  contents: write

env:
  MODULE_CONFIG: ${{ inputs.moduleConfig }}

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - name: Checkout Library
        uses: actions/checkout@v4

      - name: Checkout MavenRepo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.mavenRepo }}
          token: ${{ secrets.mavenRepoToken }}
          path: mavenRepo

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve module
        id: module
        run: |
          LINE=$(echo "$MODULE_CONFIG" | grep "^${{ inputs.artifactId }}|")

          if [ -z "$LINE" ]; then
            echo "Unknown artifact: ${{ inputs.artifactId }}"
            exit 1
          fi

          MODULE_PATH=$(echo "$LINE" | cut -d'|' -f2)
          GRADLE_PATH=$(echo "$LINE" | cut -d'|' -f3)
          GROUP_PATH=$(echo "${{ inputs.groupId }}" | tr '.' '/')

          echo "module_path=$MODULE_PATH" >> $GITHUB_OUTPUT
          echo "gradle_path=$GRADLE_PATH" >> $GITHUB_OUTPUT
          echo "group_path=$GROUP_PATH" >> $GITHUB_OUTPUT

      - name: Check version
        run: |
          ARTIFACT_DIR="mavenRepo/${{ inputs.mavenFolder }}/${{ steps.module.outputs.group_path }}/${{ inputs.artifactId }}"
          VERSION="${{ inputs.version }}"

          if [ ! -d "$ARTIFACT_DIR" ]; then
            exit 0
          fi

          if [ -d "$ARTIFACT_DIR/$VERSION" ]; then
            echo "Version already exists"
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            BASE_VERSION="${VERSION%%-*}"

            LATEST_STABLE=$(
              find "$ARTIFACT_DIR" \
                -mindepth 1 \
                -maxdepth 1 \
                -type d \
                -exec basename {} \; \
              | grep -E '^[0-9]+(\.[0-9]+)*$' \
              | sort -V \
              | tail -n 1
            )

            if [ -n "$LATEST_STABLE" ]; then
              NEWEST=$(
                printf '%s\n%s\n' \
                  "$LATEST_STABLE" \
                  "$BASE_VERSION" \
                | sort -V \
                | tail -n 1
              )

              if [ "$NEWEST" != "$BASE_VERSION" ]; then
                echo "Pre-release must target latest version or newer. Latest stable: $LATEST_STABLE"
                exit 1
              fi
            fi

            exit 0
          fi

          ALL_VERSIONS=$(
            find "$ARTIFACT_DIR" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -exec basename {} \; \
            | sed 's/-.*//'
          )

          if [ -n "$ALL_VERSIONS" ]; then
            NEWEST=$(
              printf '%s\n%s\n' \
                "$ALL_VERSIONS" \
                "$VERSION" \
              | sort -V \
              | tail -n 1
            )

            if [ "$NEWEST" != "$VERSION" ]; then
              echo "Release version must be newest"
              exit 1
            fi
          fi

      - name: Publish
        run: |
          ./gradlew \
            ${{ steps.module.outputs.gradle_path }}:publishAllPublicationsToLocalMavenRepoRepository
        env:
          VERSION: ${{ inputs.version }}

      - name: Verify publication output
        run: |
          find "${{ steps.module.outputs.module_path }}/build" \
            -type d \
            -name maven-repo

      - name: Copy artifacts
        run: |
          mkdir -p "mavenRepo/${{ inputs.mavenFolder }}"

          cp -R \
            "${{ steps.module.outputs.module_path }}/build/maven-repo/"* \
            "mavenRepo/${{ inputs.mavenFolder }}/"

      - name: Update README
        run: |
          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime

          README = Path("mavenRepo/README.md")

          library = "${{ inputs.libraryName }}"
          module = "${{ inputs.artifactId }}"
          version = "${{ inputs.version }}"
          date = datetime.utcnow().strftime("%Y-%m-%d")

          if README.exists():
              content = README.read_text(encoding="utf-8")
          else:
              content = (
                  "# Latest Releases\n\n"
                  "| Library | Module | Version |\n"
                  "| -------- | -------- | -------- |\n\n"
                  "# Releases\n\n"
                  "| Date | Library | Module | Version |\n"
                  "| -------- | -------- | -------- | -------- |\n"
              )

          latest = {}
          releases = []

          section = None

          for line in content.splitlines():
              line = line.strip()

              if line == "# Latest Releases":
                  section = "latest"
                  continue

              if line == "# Releases":
                  section = "releases"
                  continue

              if not line.startswith("|"):
                  continue

              if "Library" in line or "Date" in line:
                  continue

              if "---" in line:
                  continue

              cols = [c.strip() for c in line.strip("|").split("|")]

              if section == "latest" and len(cols) == 3:
                  latest[(cols[0], cols[1])] = cols[2]

              elif section == "releases" and len(cols) == 4:
                  releases.append(cols)

          # update latest version
          latest[(library, module)] = version

          # append release history
          releases.append([date, library, module, version])

          latest_rows = sorted(
              [(l, m, v) for (l, m), v in latest.items()],
              key=lambda x: (x[0].lower(), x[1].lower())
          )

          output = [
              "# Latest Releases",
              "",
              "| Library | Module | Version |",
              "| -------- | -------- | -------- |",
          ]

          for l, m, v in latest_rows:
              output.append(f"| {l} | {m} | {v} |")

          output.extend([
              "",
              "# Releases",
              "",
              "| Date | Library | Module | Version |",
              "| -------- | -------- | -------- | -------- |",
          ])

          for d, l, m, v in releases:
              output.append(f"| {d} | {l} | {m} | {v} |")

          README.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

      - name: Commit and Push
        run: |
          cd mavenRepo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Publish ${{ inputs.libraryName }}:${{ inputs.artifactId }} ${{ inputs.version }}"
          git push