# Publishes all Maven artifacts of the current repository into a dedicated
# artifact branch (for example: published-artifacts).
#
# Workflow:
# 1. Builds all publications via:
#      publishAllPublicationsToGitHubRepository
# 2. Collects all generated maven-repo folders from the individual modules.
# 3. Switches to the configured artifact branch.
# 4. Copies the generated Maven repository content into that branch.
# 5. Updates README.md with the published version history.
# 6. Commits and pushes the artifacts.
#
# Notes:
# - The artifact branch is completely separated from the source branch.
# - The branch root directly contains the Maven repository layout:
#     io/github/...
# - Consumers can use:
#     maven("https://raw.githubusercontent.com/<owner>/<repo>/<artifact-branch>")
# - The version is validated before publishing.
# - Existing versions cannot be published again.
# - Release history is stored in README.md on the artifact branch.
#
# Typical usage:
#
# jobs:
#   publish:
#     uses: MFlisar/kmp-devtools/.github/workflows/publish-to-github-repository.yml@<version>
#     with:
#       version: ${{ github.event.release.tag_name }}
#       artifactsBranch: published-artifacts
#

name: Publish to GitHub Repository

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

      artifactsBranch:
        required: false
        type: string
        default: published-artifacts

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare artifact branch
        run: |
          BRANCH="${{ inputs.artifactsBranch }}"

          git fetch origin "$BRANCH" || true

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git checkout "$BRANCH"
            git pull origin "$BRANCH"
          else
            git checkout --orphan "$BRANCH"

            git rm -rf . || true

            echo "# Artifact Releases" > README.md
            echo "" >> README.md
            echo "| Date | Version |" >> README.md
            echo "| -------- | -------- |" >> README.md

            git add .
            git commit -m "Initialize artifact branch"
          fi

      - name: Check version
        run: |
          VERSION="${{ inputs.version }}"
          README_FILE="README.md"

          if [ ! -f "$README_FILE" ]; then
            exit 0
          fi

          if grep -F "| $VERSION |" "$README_FILE" >/dev/null; then
            echo "Version already exists"
            exit 1
          fi

      - name: Checkout source branch
        run: |
          git checkout "${{ github.event.repository.default_branch }}"

      - name: Publish
        run: |
          ./gradlew publishAllPublicationsToGitHubRepository
        env:
          VERSION: ${{ inputs.version }}

      - name: Prepare artifact workspace
        run: |
          mkdir -p .artifacts-work

          find . -type d -name maven-repo | while read repo; do
            echo "Copying $repo"
            cp -R "$repo/"* .artifacts-work/
          done

      - name: Switch to artifact branch
        run: |
          BRANCH="${{ inputs.artifactsBranch }}"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git checkout "$BRANCH"
          else
            git checkout --orphan "$BRANCH"
          fi

      - name: Copy artifacts
        run: |
          cp -R .artifacts-work/* .

      - name: Update README
        run: |
          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime

          version = "${{ inputs.version }}"
          date = datetime.utcnow().strftime("%Y-%m-%d")

          file = Path("README.md")

          if file.exists():
              content = file.read_text(encoding="utf-8")
          else:
              content = (
                  "# Artifact Releases\n\n"
                  "| Date | Version |\n"
                  "| -------- | -------- |\n"
              )

          lines = content.splitlines()

          output = []
          inserted = False

          for line in lines:
              output.append(line)

              if not inserted and line == "| -------- | -------- |":
                  output.append(f"| {date} | {version} |")
                  inserted = True

          file.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Publish ${{ inputs.version }}"
          git push origin "${{ inputs.artifactsBranch }}"