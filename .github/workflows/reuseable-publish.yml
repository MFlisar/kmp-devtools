# -----------------------
# Publish Maven artifacts and create a GitHub release
# - called manually by consumer workflows (workflow_dispatch) with a version only
# - the publish type is derived from the version:
#   X.Y.Z         => "release": publish.release-target, normal release
#   X.Y.Z-suffix  => "test":    publish.test-target, pre-release
# - optional input "target" (auto | maven-central | github) overrides the configured target
# - the first step prints the publish plan (type + destination) to the log and the job summary
# - validates the version (SemVer, not yet released, greater than the last release)
# - after publishing creates the tag + GitHub release (test = pre-release) with a sorted commit list
# - writes a job summary with the last release, the new version, the target and the published artifacts
# - selects macos-latest when iOS/macOS targets are configured, otherwise ubuntu-latest
# - Maven Central requires GPG_KEY, GPG_PASSWORD, MAVEN_CENTRAL_USERNAME and
#   MAVEN_CENTRAL_PASSWORD; GitHub publishing requires TARGET_REPOSITORY_TOKEN
# - the caller must grant "contents: write"
# -----------------------

name: Publish

on:
  workflow_call:
    inputs:
      version:
        description: "Version, also used as tag and release name: X.Y.Z = release (publish.release-target), X.Y.Z-suffix = pre-release (publish.test-target)"
        required: true
        type: string
      target:
        description: "Publish target: auto (configured release-target / test-target), maven-central or github"
        required: false
        type: string
        default: auto
      config-file:
        description: Path to the config file, relative to the consumer repository root
        required: false
        type: string
        default: .config.yml
    outputs:
      tag:
        description: Created tag / release name
        value: ${{ jobs.create-release.outputs.tag }}
      release-url:
        description: URL of the created GitHub release
        value: ${{ jobs.create-release.outputs.release-url }}
      publish-target:
        description: Target the artifacts were published to (maven-central or github)
        value: ${{ jobs.check-publishing.outputs.publish-target }}
    secrets:
      GPG_KEY:
        required: false
      GPG_PASSWORD:
        required: false
      MAVEN_CENTRAL_USERNAME:
        required: false
      MAVEN_CENTRAL_PASSWORD:
        required: false
      TARGET_REPOSITORY_TOKEN:
        required: false

# Fixed workflow settings, not caller inputs.
env:
  RELEASE_TAG: ${{ inputs.version }}
  # VERSION_REGEX only allows "-suffix" as addition, so a "-" marks a pre-release / test publish
  PUBLISH_TYPE: ${{ contains(inputs.version, '-') && 'test' || 'release' }}
  JAVA_DISTRIBUTION: "temurin"
  VERSION_REGEX: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
  # tags of previous releases may use a "v" prefix
  RELEASE_TAG_REGEX: '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
  FILTER_OUT_DUPLICATE_COMMITS: "true"
  COMMITS_HEADING: "## ✨ Changes"
  # Each non-empty line is a Python regular expression matched against a commit subject.
  COMMIT_MESSAGE_EXCLUDE_REGEX: |
    ^Merge branch
    ^[. ]+$
    (?i)\[(?:skip ci|ci skip|no ci|skip actions|actions skip)\]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-publishing:
    name: "Check ${{ inputs.version }} (${{ contains(inputs.version, '-') && 'test / pre-release' || 'release' }})"
    runs-on: ubuntu-latest
    outputs:
      publish-target: ${{ steps.read-config.outputs.publish-target }}
      maven-central-enabled: ${{ steps.read-config.outputs.maven-central-enabled }}
      github-enabled: ${{ steps.read-config.outputs.github-enabled }}
      java-version: ${{ steps.read-config.outputs.java-version }}
      publish-runner: ${{ steps.detect-runner.outputs.publish-runner }}
      target-repository: ${{ steps.read-config.outputs.target-repository }}
      target-branch: ${{ steps.read-config.outputs.target-branch }}
      target-path: ${{ steps.read-config.outputs.target-path }}
      last-release: ${{ steps.validate-version.outputs.last-release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read publishing settings
        id: read-config
        uses: MFlisar/kmp-devtools/.github/actions/read-config@main
        with:
          config-file: ${{ inputs.config-file }}
          publish-type: ${{ env.PUBLISH_TYPE }}
          publish-target: ${{ inputs.target }}

      - name: Show publish plan
        shell: bash
        env:
          PUBLISH_TARGET: ${{ steps.read-config.outputs.publish-target }}
          PUBLISH_TARGET_SOURCE: ${{ steps.read-config.outputs.publish-target-source }}
          GROUP_ID: ${{ steps.read-config.outputs.group-id }}
          TARGET_REPOSITORY: ${{ steps.read-config.outputs.target-repository }}
          TARGET_BRANCH: ${{ steps.read-config.outputs.target-branch }}
          TARGET_PATH: ${{ steps.read-config.outputs.target-path }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_TYPE" == "test" ]]; then
            mode="TEST (pre-release)"
          else
            mode="RELEASE"
          fi
          target_key="$PUBLISH_TARGET_SOURCE"
          case "$PUBLISH_TARGET" in
            maven-central) destination="Maven Central (group $GROUP_ID)" ;;
            github)        destination="GitHub Maven repository $TARGET_REPOSITORY@$TARGET_BRANCH:/${TARGET_PATH}" ;;
            *)             destination="nothing ($target_key is '$PUBLISH_TARGET')" ;;
          esac

          plan="$mode $RELEASE_TAG -> $PUBLISH_TARGET"
          echo "::notice title=Publish plan::$plan"
          echo "Version:      $RELEASE_TAG"
          echo "Mode:         $mode"
          echo "Target from:  $target_key = $PUBLISH_TARGET"
          echo "Destination:  $destination"
          echo "Commit:       $GITHUB_SHA ($GITHUB_REF_NAME)"

          {
            echo "## 🚀 Publish plan: $RELEASE_TAG"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$RELEASE_TAG\` |"
            echo "| Mode | **$mode** |"
            echo "| Target | \`$target_key\` = \`$PUBLISH_TARGET\` |"
            echo "| Destination | $destination |"
            echo "| GitHub release | $([[ "$PUBLISH_TYPE" == "test" ]] && echo "pre-release" || echo "release (latest)") |"
            echo "| Commit | \`$GITHUB_SHA\` (\`$GITHUB_REF_NAME\`) |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate version
        id: validate-version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TARGET: ${{ steps.read-config.outputs.publish-target }}
        run: |
          set -euo pipefail

          last_release="$(
            gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' |
              python3 -c '
          import os, re, sys
          pattern = re.compile(os.environ["RELEASE_TAG_REGEX"])
          def key(tag):
              m = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+.*)?", tag)
              pre = m.group(4)
              pre_key = tuple((0, int(p), "") if p.isdigit() else (1, 0, p.casefold()) for p in re.findall(r"[0-9]+|[A-Za-z]+", pre or ""))
              return (tuple(int(m.group(i)) for i in (1, 2, 3)), int(pre is None), pre_key)
          tags = [t for t in sys.stdin.read().split() if pattern.fullmatch(t)]
          print(max(tags, key=key) if tags else "")
          '
          )"
          echo "last-release=$last_release" >> "$GITHUB_OUTPUT"

          errors=()
          if [[ ! "$RELEASE_TAG" =~ $VERSION_REGEX ]]; then
            errors+=("Version '$RELEASE_TAG' is invalid; expected X.Y.Z or X.Y.Z-suffix (e.g. 1.0.0, 1.1.0-beta01).")
          else
            if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
              errors+=("Tag '$RELEASE_TAG' already exists.")
            fi
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              errors+=("Release '$RELEASE_TAG' already exists.")
            fi
            if [[ -n "$last_release" ]]; then
              is_greater="$(python3 - "$RELEASE_TAG" "$last_release" <<'PY'
          import re, sys
          def key(tag):
              m = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+.*)?", tag)
              pre = m.group(4)
              pre_key = tuple((0, int(p), "") if p.isdigit() else (1, 0, p.casefold()) for p in re.findall(r"[0-9]+|[A-Za-z]+", pre or ""))
              return (tuple(int(m.group(i)) for i in (1, 2, 3)), int(pre is None), pre_key)
          print("true" if key(sys.argv[1]) > key(sys.argv[2]) else "false")
          PY
              )"
              if [[ "$is_greater" != "true" ]]; then
                errors+=("Version '$RELEASE_TAG' must be greater than the last release '$last_release'.")
              fi
            fi
          fi
          if [[ "$PUBLISH_TARGET" == "none" ]]; then
            errors+=("publish.$PUBLISH_TYPE-target is 'none'; nothing to publish for type '$PUBLISH_TYPE'.")
          fi

          {
            echo "### 🔎 Version check"
            echo
            echo "- Last release: \`${last_release:-–}\` → new version \`$RELEASE_TAG\`"
            if (( ${#errors[@]} > 0 )); then
              echo
              echo "### ❌ Validation failed"
              printf -- '- %s\n' "${errors[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Last release: ${last_release:-<none>}"
          if (( ${#errors[@]} > 0 )); then
            for error in "${errors[@]}"; do
              echo "::error::$error"
            done
            exit 1
          fi

      - name: Validate publishing credentials
        env:
          TARGET_REPOSITORY_TOKEN: ${{ secrets.TARGET_REPOSITORY_TOKEN }}
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          PUBLISH_TARGET: ${{ steps.read-config.outputs.publish-target }}
          JAVA_VERSION: ${{ steps.read-config.outputs.java-version }}
        run: |
          set -euo pipefail
          required_secrets=()
          case "$PUBLISH_TARGET" in
            maven-central)
              required_secrets=(GPG_KEY GPG_PASSWORD MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD)
              ;;
            github)
              required_secrets=(TARGET_REPOSITORY_TOKEN)
              ;;
          esac
          missing_credentials=false
          for secret in "${required_secrets[@]}"; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::$secret is required for publish target $PUBLISH_TARGET."
              missing_credentials=true
            fi
          done
          if [[ "$missing_credentials" == "true" ]]; then
            exit 1
          fi

          echo "Version: $RELEASE_TAG"
          echo "Publish type: $PUBLISH_TYPE"
          echo "Publish target: $PUBLISH_TARGET"
          echo "Java version: $JAVA_VERSION"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ steps.read-config.outputs.java-version }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Detect required publish runner
        id: detect-runner
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          tasks="$(CI=true ./gradlew -q tasks --all)"
          runner=ubuntu-latest
          if grep -Eiq '(^|:)compileKotlin(ios|macos)[[:alnum:]]*[[:space:]]+-' <<< "$tasks"; then
            runner=macos-latest
          fi
          echo "publish-runner=$runner" >> "$GITHUB_OUTPUT"
          echo "Publish runner: $runner"

  publish-library:
    name: Build and publish artifacts
    needs: check-publishing
    runs-on: ${{ needs.check-publishing.outputs.publish-runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ needs.check-publishing.outputs.java-version }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and publish selected destination
        run: |
          set -euo pipefail
          publish_tasks=()
          case "$PUBLISH_TARGET" in
            maven-central)
              publish_tasks+=(publish)
              ;;
            github)
              publish_tasks+=(publishAllPublicationsToGitHubRepository)
              ;;
            *)
              echo "::error::Unsupported publish target: $PUBLISH_TARGET"
              exit 1
              ;;
          esac

          echo "Version: $RELEASE_TAG"
          echo "Publish type: $PUBLISH_TYPE"
          echo "Gradle publishing tasks: ${publish_tasks[*]}"
          CI=true ./gradlew "${publish_tasks[@]}" --no-daemon --parallel
        env:
          PUBLISH_TARGET: ${{ needs.check-publishing.outputs.publish-target }}
          VERSION: ${{ env.RELEASE_TAG }}
          TAG: ${{ env.RELEASE_TAG }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Add published artifacts to summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          from xml.etree import ElementTree

          artifacts = set()
          for pom in Path(".").rglob("build/publications/*/pom-default.xml"):
              root = ElementTree.parse(pom).getroot()
              ns = {"m": root.tag[1:].split("}")[0]} if root.tag.startswith("{") else {}
              find = (lambda tag: root.findtext(f"m:{tag}", namespaces=ns)) if ns else root.findtext
              artifacts.add(f"{find('groupId')}:{find('artifactId')}:{find('version')}")

          print("### 📦 Published artifacts")
          print()
          if artifacts:
              for artifact in sorted(artifacts):
                  print(f"- `{artifact}`")
          else:
              print("_No generated POM files found._")
          PY

      - name: Collect Maven artifacts
        if: ${{ needs.check-publishing.outputs.github-enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/maven-artifacts"
          mkdir -p "$artifact_directory"

          while IFS= read -r -d '' repository; do
            echo "Collecting artifacts from $repository"
            rsync -a \
              --exclude='*.sha256' \
              --exclude='*.sha512' \
              --exclude='*.asc.md5' \
              --exclude='*.asc.sha1' \
              "$repository/" "$artifact_directory/"
          done < <(find . -type d -name maven-repo -not -path './.git/*' -print0)

          if ! find "$artifact_directory" -type f -name '*.pom' -print -quit | grep -q .; then
            echo "::error::No Maven POM files were generated."
            exit 1
          fi

      - name: Checkout target repository
        if: ${{ needs.check-publishing.outputs.github-enabled == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.check-publishing.outputs.target-repository }}
          ref: ${{ needs.check-publishing.outputs.target-branch }}
          token: ${{ secrets.TARGET_REPOSITORY_TOKEN }}
          path: target-repository
          fetch-depth: 0

      - name: Copy artifacts to target repository
        if: ${{ needs.check-publishing.outputs.github-enabled == 'true' }}
        shell: bash
        env:
          TARGET_REPOSITORY_PATH: ${{ needs.check-publishing.outputs.target-path }}
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          target_directory="$GITHUB_WORKSPACE/target-repository"
          if [[ -n "$TARGET_REPOSITORY_PATH" ]]; then
            target_directory="$target_directory/$TARGET_REPOSITORY_PATH"
          fi
          mkdir -p "$target_directory"
          export target_directory

          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          artifacts = Path(os.environ["RUNNER_TEMP"]) / "maven-artifacts"
          target = Path(os.environ["target_directory"])
          existing = [
              str(pom.relative_to(artifacts))
              for pom in artifacts.rglob("*.pom")
              if (target / pom.relative_to(artifacts)).exists()
          ]
          if existing:
              print(
                  "::error::This version already exists in the target Maven repository: "
                  + ", ".join(existing)
              )
              sys.exit(1)
          PY

          # Keep published versioned files immutable; Maven metadata is merged below.
          rsync -a --ignore-existing "$RUNNER_TEMP/maven-artifacts/" "$target_directory/"

          python3 - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path
          from xml.etree import ElementTree

          artifacts = Path(os.environ["RUNNER_TEMP"]) / "maven-artifacts"
          target = Path(os.environ["target_directory"])
          checksum_algorithms = {
              ".md5": "md5",
              ".sha1": "sha1",
          }

          def version_key(version):
              match = re.fullmatch(
                  r"v?(\d+(?:\.\d+)*)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?",
                  version,
              )
              if match is None:
                  return ((), 0, ((1, version.casefold()),))

              core = tuple(int(part) for part in match.group(1).split("."))
              core += (0,) * max(0, 3 - len(core))
              prerelease = match.group(2)
              prerelease_key = tuple(
                  (0, int(part)) if part.isdigit() else (1, part.casefold())
                  for part in re.findall(r"[0-9]+|[A-Za-z]+", prerelease or "")
              )
              return (core, int(prerelease is None), prerelease_key)

          for source_metadata in artifacts.rglob("maven-metadata.xml"):
              relative_path = source_metadata.relative_to(artifacts)
              target_metadata = target / relative_path
              source_root = ElementTree.parse(source_metadata).getroot()
              if source_root.find("version") is not None:
                  continue

              target_root = ElementTree.parse(target_metadata).getroot()

              source_versioning = source_root.find("versioning")
              target_versioning = target_root.find("versioning")
              if source_versioning is None or target_versioning is None:
                  continue

              source_versions = source_versioning.find("versions")
              target_versions = target_versioning.find("versions")
              if target_versions is None:
                  target_versions = ElementTree.SubElement(target_versioning, "versions")

              versions = {
                  version.text
                  for version in target_versions.findall("version")
                  if version.text
              }
              if source_versions is not None:
                  versions.update(
                      version.text
                      for version in source_versions.findall("version")
                      if version.text
                  )

              for version in list(target_versions):
                  target_versions.remove(version)
              for version in sorted(versions, key=version_key):
                  ElementTree.SubElement(target_versions, "version").text = version

              for field in ("latest", "release"):
                  candidates = versions.copy()
                  for versioning in (source_versioning, target_versioning):
                      value = versioning.findtext(field)
                      if value:
                          candidates.add(value)
                  if field == "release":
                      candidates = {
                          version
                          for version in candidates
                          if not version.upper().endswith("-SNAPSHOT")
                      }
                  if not candidates:
                      continue

                  element = target_versioning.find(field)
                  if element is None:
                      element = ElementTree.Element(field)
                      target_versioning.insert(
                          list(target_versioning).index(target_versions),
                          element,
                      )
                  element.text = max(candidates, key=version_key)

              source_last_updated = source_versioning.findtext("lastUpdated")
              if source_last_updated:
                  element = target_versioning.find("lastUpdated")
                  if element is None:
                      element = ElementTree.SubElement(target_versioning, "lastUpdated")
                  element.text = source_last_updated

              target_metadata.parent.mkdir(parents=True, exist_ok=True)
              ElementTree.indent(target_root, space="  ")
              ElementTree.ElementTree(target_root).write(
                  target_metadata,
                  encoding="UTF-8",
                  xml_declaration=True,
              )

              content = target_metadata.read_bytes()
              for suffix in (".sha256", ".sha512"):
                  redundant_checksum = Path(str(target_metadata) + suffix)
                  if redundant_checksum.exists():
                      redundant_checksum.unlink()
              for suffix, algorithm in checksum_algorithms.items():
                  checksum_path = Path(str(target_metadata) + suffix)
                  source_checksum = Path(str(source_metadata) + suffix)
                  if checksum_path.exists() or source_checksum.exists():
                      digest = hashlib.new(algorithm, content).hexdigest()
                      checksum_path.write_text(digest + "\n", encoding="ascii")
          PY

      - name: Commit and push artifacts
        if: ${{ needs.check-publishing.outputs.github-enabled == 'true' }}
        working-directory: target-repository
        env:
          TARGET_REPOSITORY_PATH: ${{ needs.check-publishing.outputs.target-path }}
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
          TARGET_BRANCH: ${{ needs.check-publishing.outputs.target-branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$TARGET_REPOSITORY_PATH" ]]; then
            git add -A -- "$TARGET_REPOSITORY_PATH"
          else
            git add -A
          fi

          if git diff --cached --quiet; then
            echo "No new artifact files to commit."
            exit 0
          fi

          git commit -m "Publish $RELEASE_VERSION"
          git push origin "$TARGET_BRANCH"

  create-release:
    name: Create tag and GitHub release
    needs: [check-publishing, publish-library]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.create.outputs.tag }}
      release-url: ${{ steps.create.outputs.release-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release with sorted commit list
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          commits_file="$RUNNER_TEMP/release-commits.txt"
          notes_file="$RUNNER_TEMP/release-notes.md"

          previous_release_tag="$(
            git tag --merged HEAD --sort=-version:refname |
              python3 -c 'import os, re, sys; pattern = re.compile(os.environ["RELEASE_TAG_REGEX"]); tags = sys.stdin.read().splitlines(); print(next((tag for tag in tags if pattern.fullmatch(tag)), ""))'
          )"

          if [[ -n "$previous_release_tag" ]]; then
            git log --format=%s "$previous_release_tag..HEAD" > "$commits_file"
          else
            git log --format=%s HEAD > "$commits_file"
          fi

          python3 - "$commits_file" "$notes_file" <<'PY'
          import os
          import pathlib
          import re
          import sys

          source_path, output_path = sys.argv[1:]
          exclusions = [
              re.compile(pattern.strip())
              for pattern in os.environ["COMMIT_MESSAGE_EXCLUDE_REGEX"].splitlines()
              if pattern.strip()
          ]
          messages = []
          for message in pathlib.Path(source_path).read_text().splitlines():
              message = message.strip()
              if message and not any(pattern.search(message) for pattern in exclusions):
                  messages.append(message)

          messages.sort(key=str.casefold)
          if os.environ["FILTER_OUT_DUPLICATE_COMMITS"].strip().lower() == "true":
              unique_commits = []
              seen = set()
              for message in messages:
                  normalized = message.casefold()
                  if normalized not in seen:
                      seen.add(normalized)
                      unique_commits.append(message)
              messages = unique_commits

          notes = ""
          if messages:
              notes += "<!-- release-commits:start -->\n"
              notes += os.environ["COMMITS_HEADING"] + "\n"
              notes += "".join(f"* {message}\n" for message in messages)
              notes += "<!-- release-commits:end -->\n"
          pathlib.Path(output_path).write_text(notes)
          PY

          release_args=(--target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file "$notes_file")
          if [[ "$PUBLISH_TYPE" == "test" ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          release_url="$(gh release create "$RELEASE_TAG" "${release_args[@]}")"

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release-url=$release_url" >> "$GITHUB_OUTPUT"
          {
            echo "### 🏷️ Release"
            echo
            echo "- Release: [$RELEASE_TAG]($release_url)$([[ "$PUBLISH_TYPE" == "test" ]] && echo " (pre-release)")"
            echo "- Previous release tag: \`${previous_release_tag:-–}\`"
          } >> "$GITHUB_STEP_SUMMARY"
