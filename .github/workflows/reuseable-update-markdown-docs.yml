# -----------------------
# Update Markdown Docs
# - generates documentation and updates README snippets
# - validates links and commits generated changes
# -----------------------

name: Update Markdown Docs

on:
  workflow_call:
    inputs:
      config-file:
        description: Path to the config file, relative to the consumer repository root
        required: false
        type: string
        default: .config.yml

# Fixed workflow settings, not caller inputs.
env:
  CHECKOUT_FETCH_DEPTH: "0"
  JAVA_DISTRIBUTION: "temurin"
  UPDATE_DOCS_GRADLE_TASK: "updateMarkdownFiles"
  DOTNET_VERSION: "8.0.x"
  LYCHEE_ARGS: >-
    --root-dir "${{ github.workspace }}" --verbose --no-progress
    './**/*.md' './**/*.html'

permissions:
  contents: write

jobs:
  update-markdown-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}

      - name: Read documentation settings
        id: read-config
        uses: MFlisar/kmp-devtools/.github/actions/read-config@main
        with:
          config-file: ${{ inputs.config-file }}

      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ steps.read-config.outputs.java-version }}

      - name: Grant Permission to Execute Gradle
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v6

      - name: Run Gradle update task
        run: ./gradlew "$UPDATE_DOCS_GRADLE_TASK"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run MarkdownSnippets
        run: |
          dotnet tool install --global MarkdownSnippets.Tool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
          mdsnippets --convention InPlaceOverwrite --omit-snippet-links true

      - name: Prepare Lychee URL filters
        id: lychee-args
        shell: bash
        env:
          PUBLISH_URL_PATHS_JSON: ${{ steps.read-config.outputs.publish-url-paths-json }}
        run: |
          set -euo pipefail
          ruby -rjson -e '
            owner, repository = ENV.fetch("GITHUB_REPOSITORY").split("/", 2)
            base_url = "https://#{owner}.github.io/#{repository}"
            paths = [""] + JSON.parse(ENV.fetch("PUBLISH_URL_PATHS_JSON"))
            excludes = paths.map do |path|
              url = path.empty? ? base_url : "#{base_url}/#{path}"
              pattern = "(?i)^#{Regexp.escape(url)}/?(?:[?#].*)?$"
              "--exclude \u0027#{pattern}\u0027"
            end
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
              output.puts("args=#{ENV.fetch("LYCHEE_ARGS")} #{excludes.join(" ")}")
            end
          '

      - name: Check links with Lychee
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ steps.lychee-args.outputs.args }}

      - name: Remove lychee folder
        run: rm -rf lychee

      - name: Commit & push changes (if any)
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "update-docs: automated update [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
