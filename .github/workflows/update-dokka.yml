name: update-dokka (reusable)

on:
  workflow_call:
    inputs:
      java:
        type: string
        required: false
        default: "17"
      dokka_gradle_task:
        type: string
        required: false
        default: ":dokka:dokkaGenerate"
      dokka_html_path:
        type: string
        required: false
        default: "library/dokka/build/dokka/html"

permissions:
  pages: write
  id-token: write

jobs:
  dokka-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java }}

      - name: Grant Permission to Execute Gradle
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v3

      - name: Build Dokka HTML
        run: ./gradlew ${{ inputs.dokka_gradle_task }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.dokka_html_path }}

  deploy-pages:
    runs-on: ubuntu-latest
    needs: dokka-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
