name: Read project config
description: Parse the project config and expose all workflow configuration values
inputs:
  config-file:
    description: Path to the project configuration file
    required: false
    default: .config.yml
  publish-type:
    description: Publish type (release or test); selects publish.release-target or publish.test-target
    required: false
    default: release
outputs:
  publish-enabled:
    description: Whether publishing is enabled for the selected publish type
    value: ${{ steps.parse.outputs.publish-enabled }}
  publish-type:
    description: Selected publish type (release or test)
    value: ${{ steps.parse.outputs.publish-type }}
  publish-target:
    description: Publishing target for the selected publish type
    value: ${{ steps.parse.outputs.publish-target }}
  release-target:
    description: Configured publish.release-target
    value: ${{ steps.parse.outputs.release-target }}
  test-target:
    description: Configured publish.test-target
    value: ${{ steps.parse.outputs.test-target }}
  group-id:
    description: Configured publish.group-id
    value: ${{ steps.parse.outputs.group-id }}
  maven-central-enabled:
    description: Whether Maven Central publishing is enabled
    value: ${{ steps.parse.outputs.maven-central-enabled }}
  github-enabled:
    description: Whether GitHub repository publishing is enabled
    value: ${{ steps.parse.outputs.github-enabled }}
  java-version:
    description: Configured Java version
    value: ${{ steps.parse.outputs.java-version }}
  target-repository:
    description: GitHub Maven repository in owner/repository form
    value: ${{ steps.parse.outputs.target-repository }}
  target-branch:
    description: Target Maven repository branch
    value: ${{ steps.parse.outputs.target-branch }}
  target-path:
    description: Path in the target Maven repository
    value: ${{ steps.parse.outputs.target-path }}
  page-title:
    description: Project title for the GitHub Pages landing page
    value: ${{ steps.parse.outputs.page-title }}
  demo-enabled:
    description: Whether a demo is configured for publishing
    value: ${{ steps.parse.outputs.demo-enabled }}
  demo-apps-json:
    description: JSON array of published demo app metadata with url-path, task, and html-path
    value: ${{ steps.parse.outputs.demo-apps-json }}
  publish-url-paths-json:
    description: JSON array of all relative apps.publish.url-path values
    value: ${{ steps.parse.outputs.publish-url-paths-json }}
runs:
  using: composite
  steps:
    - id: parse
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
        PUBLISH_TYPE: ${{ inputs.publish-type }}
      run: ruby "${{ github.action_path }}/read-config.rb"
